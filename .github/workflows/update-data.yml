name: Update Malone Markets data

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch Yahoo Finance data
        env:
          DAILY_SNAPSHOT: ${{ github.event.schedule == '30 20 * * *' }}
        run: |
          python -m pip install --disable-pip-version-check -q yfinance pandas
          python <<'PY'
          import yfinance as yf
          import pandas as pd
          import json, math, time, os
          from datetime import datetime, timezone

          try:
              with open('watchlist.json', 'r', encoding='utf-8') as fh:
                  watchlist = json.load(fh)
              symbols = [x['symbol'] for x in watchlist if x.get('symbol')]
          except Exception:
              symbols = ['ALL.AX','BHP.AX','CSL.AX','FMG.AX','GNP.AX','GTUM.AX','HACK.AX','JBH.AX','QAN.AX','RMD.AX','TLX.AX','VAS.AX','XRO.AX','AMZN','ANET','AVGO','CSCO','ETN','GEV','GOOG','JPM','LLY','META','MSFT','MU','NVDA','PANW','S','V','ZS']

          now = datetime.now(timezone.utc)
          is_daily_snapshot_run = os.environ.get("DAILY_SNAPSHOT", "false").lower() == "true"
          out = {
            'updated_at': now.isoformat(),
            'source': 'Yahoo Finance via yfinance',
            'model_version': '4.0',
            'stocks': []
          }

          # Daily snapshot baseline: compare against the most recent saved daily snapshot,
          # not the previous 15-minute refresh. This keeps score movement meaningful.
          previous = {}
          snapshot_date = None
          try:
              from zoneinfo import ZoneInfo
              mel_now = now.astimezone(ZoneInfo('Australia/Melbourne'))
              snapshot_date = mel_now.date().isoformat()
          except Exception:
              snapshot_date = now.date().isoformat()

          snapshot_dir = 'snapshots'
          os.makedirs(snapshot_dir, exist_ok=True)
          prior_files = sorted([f for f in os.listdir(snapshot_dir) if f.endswith('.json') and f[:10] < snapshot_date])
          if prior_files:
              try:
                  with open(os.path.join(snapshot_dir, prior_files[-1]), 'r', encoding='utf-8') as fh:
                      old = json.load(fh)
                  previous = {x.get('symbol'): x for x in old.get('stocks', [])}
              except Exception:
                  previous = {}

          def n(v):
              try:
                  if v is None: return None
                  v = float(v)
                  return None if math.isnan(v) or math.isinf(v) else v
              except Exception:
                  return None

          def pct(v):
              v = n(v)
              if v is None: return None
              return v * 100 if abs(v) <= 2 else v

          def avg(values, default=50):
              vals = [v for v in values if v is not None]
              return sum(vals)/len(vals) if vals else default

          def clamp(v, lo=0, hi=100):
              return max(lo, min(hi, v))

          def frame_row(df, key):
              try:
                  if df is None or len(df) == 0: return {}
                  if key in df.index:
                      row = df.loc[key]
                      return row.to_dict() if hasattr(row, 'to_dict') else {}
              except Exception:
                  pass
              return {}

          def cell(df, key, column=None):
              try:
                  row = frame_row(df, key)
                  if column is None:
                      vals = list(row.values())
                      return n(vals[0]) if vals else None
                  return n(row.get(column))
              except Exception:
                  return None

          def safe_call(fn, default=None):
              try:
                  return fn()
              except Exception:
                  return default

          def epoch_to_iso(value):
              # Yahoo commonly supplies providerPublishTime as Unix seconds.
              # Guard against milliseconds and invalid/1970-style values.
              try:
                  if isinstance(value, str):
                      s = value.strip()
                      if not s: return None
                      if s.isdigit(): value = float(s)
                      else:
                          dt = datetime.fromisoformat(s.replace('Z', '+00:00'))
                          return dt.astimezone(timezone.utc).isoformat()
                  value = float(value)
                  if value > 10_000_000_000: value /= 1000.0
                  if value < 946684800 or value > (now.timestamp() + 366*24*3600): return None
                  return datetime.fromtimestamp(value, timezone.utc).isoformat()
              except Exception:
                  return None

          def normalize_news(items):
              result = []
              seen = set()
              for item in items or []:
                  if not isinstance(item, dict): continue
                  content = item.get('content') if isinstance(item.get('content'), dict) else item
                  title = content.get('title') or item.get('title')
                  link = content.get('canonicalUrl', {}).get('url') if isinstance(content.get('canonicalUrl'), dict) else None
                  if not link and isinstance(content.get('clickThroughUrl'), dict): link = content.get('clickThroughUrl', {}).get('url')
                  link = link or content.get('link') or item.get('link') or item.get('url')
                  publisher = content.get('provider', {}).get('displayName') if isinstance(content.get('provider'), dict) else None
                  publisher = publisher or content.get('publisher') or item.get('publisher')
                  ts = content.get('providerPublishTime') or item.get('providerPublishTime') or content.get('pubDate') or item.get('pubDate')
                  published = epoch_to_iso(ts)
                  if not title or not link: continue
                  key = (title.strip(), link)
                  if key in seen: continue
                  seen.add(key)
                  result.append({'title': title.strip(), 'publisher': publisher or 'Yahoo Finance', 'link': link, 'published_at': published})
              result.sort(key=lambda x: x.get('published_at') or '', reverse=True)
              return result[:5]

          for symbol in symbols:
              x = {'symbol': symbol}
              try:
                  t = yf.Ticker(symbol)
                  info = safe_call(lambda: t.get_info() or {}, {})
                  fast = safe_call(lambda: t.fast_info or {}, {})

                  price = n(info.get('currentPrice')) or n(fast.get('last_price'))
                  prev = n(info.get('previousClose')) or n(fast.get('previous_close'))
                  market_cap = n(info.get('marketCap'))
                  fcf = n(info.get('freeCashflow'))
                  ocf = n(info.get('operatingCashflow'))
                  total_debt = n(info.get('totalDebt'))
                  cash = n(info.get('totalCash'))
                  ebitda = n(info.get('ebitda'))

                  x.update({
                    'price': price,
                    'previous_close': prev,
                    'day_pct': ((price/prev)-1)*100 if price and prev else None,
                    'market_cap': market_cap,
                    'pe': n(info.get('trailingPE')),
                    'forward_pe': n(info.get('forwardPE')),
                    'peg': n(info.get('pegRatio')),
                    'ps': n(info.get('priceToSalesTrailing12Months')),
                    'pb': n(info.get('priceToBook')),
                    'ev_ebitda': n(info.get('enterpriseToEbitda')),
                    'revenue_growth': pct(info.get('revenueGrowth')),
                    'earnings_growth': pct(info.get('earningsGrowth')),
                    'profit_margin': pct(info.get('profitMargins')),
                    'operating_margin': pct(info.get('operatingMargins')),
                    'roe': pct(info.get('returnOnEquity')),
                    'roa': pct(info.get('returnOnAssets')),
                    'roic': pct(info.get('returnOnCapital')),
                    'fcf': fcf,
                    'ocf': ocf,
                    'fcf_yield': (fcf/market_cap)*100 if fcf is not None and market_cap else None,
                    'p_fcf': (market_cap/fcf) if fcf is not None and market_cap and fcf > 0 else None,
                    'net_debt_ebitda': ((total_debt or 0) - (cash or 0))/ebitda if ebitda and total_debt is not None else None,
                    'dividend_rate': n(info.get('dividendRate')),
                    'dividend_yield': None,
                    'dividend_yield_raw': n(info.get('dividendYield')),
                    'payout_ratio': pct(info.get('payoutRatio')),
                    'target_mean': n(info.get('targetMeanPrice')),
                    'target_low': n(info.get('targetLowPrice')),
                    'target_high': n(info.get('targetHighPrice')),
                    'recommendation': info.get('recommendationKey'),
                    'high_52w': n(info.get('fiftyTwoWeekHigh')),
                    'low_52w': n(info.get('fiftyTwoWeekLow')),
                    'sector': info.get('sector'),
                    'industry': info.get('industry'),
                    'currency': info.get('currency'),
                    'asset_type': info.get('quoteType') or info.get('typeDisp')
                  })

                  # Normalize dividend yield from annual cash dividend / price when available.
                  if x.get('dividend_rate') is not None and price:
                      calc_yield = (x['dividend_rate'] / price) * 100
                      if 0 <= calc_yield <= 20: x['dividend_yield'] = calc_yield
                  if x.get('dividend_yield') is None and x.get('dividend_yield_raw') is not None:
                      raw = x['dividend_yield_raw']; candidate = raw * 100 if abs(raw) <= 2 else raw
                      if 0 <= candidate <= 20: x['dividend_yield'] = candidate

                  # Analyst forward estimates and EPS trend/revisions.
                  ee = safe_call(lambda: t.get_earnings_estimate(), None)
                  re = safe_call(lambda: t.get_revenue_estimate(), None)
                  et = safe_call(lambda: t.get_eps_trend(), None)
                  er = safe_call(lambda: t.get_eps_revisions(), None)
                  ge = safe_call(lambda: t.get_growth_estimates(), None)
                  eh = safe_call(lambda: t.get_earnings_history(), None)

                  def df_value(df, idx, col):
                      try:
                          if df is None or idx not in df.index or col not in df.columns: return None
                          return n(df.loc[idx, col])
                      except Exception: return None

                  x['forward_eps_growth'] = pct(df_value(ee, '+1y', 'growth'))
                  x['forward_revenue_growth'] = pct(df_value(re, '+1y', 'growth'))
                  x['eps_estimate'] = df_value(ee, '+1y', 'avg')
                  x['revenue_estimate'] = df_value(re, '+1y', 'avg')
                  x['eps_trend_30d'] = None
                  cur_eps = df_value(et, '+1y', 'current')
                  old_eps = df_value(et, '+1y', '30daysAgo')
                  if cur_eps is not None and old_eps not in (None, 0):
                      x['eps_trend_30d'] = (cur_eps/old_eps - 1)*100
                  x['eps_up_7d'] = df_value(er, '+1y', 'upLast7days')
                  x['eps_up_30d'] = df_value(er, '+1y', 'upLast30days')
                  x['eps_down_7d'] = df_value(er, '+1y', 'downLast7days')
                  x['eps_down_30d'] = df_value(er, '+1y', 'downLast30days')
                  x['long_term_growth'] = pct(df_value(ge, '+5y', 'stock'))

                  # Latest earnings surprise.
                  x['latest_surprise_pct'] = None
                  try:
                      if eh is not None and len(eh):
                          latest = eh.sort_index().iloc[-1]
                          x['latest_surprise_pct'] = n(latest.get('surprisePercent'))
                  except Exception:
                      pass

                  # Recent analyst changes.
                  x['upgrades_90d'] = 0
                  x['downgrades_90d'] = 0
                  ud = safe_call(lambda: t.get_upgrades_downgrades(), None)
                  try:
                      if ud is not None and len(ud):
                          cutoff = pd.Timestamp.now(tz='UTC') - pd.Timedelta(days=90)
                          idx = pd.to_datetime(ud.index, utc=True, errors='coerce')
                          recent = ud[idx >= cutoff]
                          actions = recent['action'].astype(str).str.lower() if 'action' in recent.columns else pd.Series(dtype=str)
                          to_grades = recent['toGrade'].astype(str).str.lower() if 'toGrade' in recent.columns else pd.Series(dtype=str)
                          from_grades = recent['fromGrade'].astype(str).str.lower() if 'fromGrade' in recent.columns else pd.Series(dtype=str)
                          up_mask = actions.str.contains(r'upgrade|raised|raise|overweight|outperform|buy', regex=True, na=False)
                          down_mask = actions.str.contains(r'downgrade|lowered|lower|underweight|underperform|sell', regex=True, na=False)
                          if not up_mask.any() and len(recent):
                              up_mask = to_grades.str.contains(r'buy|outperform|overweight|strong buy', regex=True, na=False) & ~from_grades.str.contains(r'buy|outperform|overweight|strong buy', regex=True, na=False)
                          if not down_mask.any() and len(recent):
                              down_mask = to_grades.str.contains(r'sell|underperform|underweight|reduce', regex=True, na=False) & ~from_grades.str.contains(r'sell|underperform|underweight|reduce', regex=True, na=False)
                          x['upgrades_90d'] = int(up_mask.sum())
                          x['downgrades_90d'] = int(down_mask.sum())
                  except Exception:
                      pass

                  # News with robust timestamp normalization.
                  news = safe_call(lambda: t.get_news(count=8), [])
                  normalized_news = normalize_news(news)
                  if not normalized_news:
                      search = safe_call(lambda: yf.Search(symbol, news_count=8), None)
                      search_news = getattr(search, 'news', []) if search is not None else []
                      normalized_news = normalize_news(search_news)
                  x['news'] = normalized_news

                  # ---------- scoring ----------
                  # Growth: forward + current growth, with long-term estimate as a bonus.
                  growth_parts = []
                  for v, w in [(x.get('revenue_growth'), .20), (x.get('earnings_growth'), .20),
                               (x.get('forward_eps_growth'), .25), (x.get('forward_revenue_growth'), .20),
                               (x.get('long_term_growth'), .15)]:
                      if v is not None:
                          growth_parts.append((clamp(50 + v*1.5), w))
                  g = sum(v*w for v,w in growth_parts)/sum(w for _,w in growth_parts) if growth_parts else 50

                  quality_vals = []
                  for v, scale in [(x.get('profit_margin'), 1.5), (x.get('operating_margin'), 1.5),
                                   (x.get('roe'), 1.2), (x.get('roa'), 2.0), (x.get('roic'), 1.2)]:
                      if v is not None:
                          quality_vals.append(clamp(50 + v*scale))
                  q = avg(quality_vals)

                  valuation_parts = []
                  for v, base, scale in [(x.get('pe'), 20, 2.0), (x.get('forward_pe'), 18, 2.2),
                                          (x.get('ps'), 5, 6), (x.get('pb'), 3, 7), (x.get('ev_ebitda'), 15, 2)]:
                      if v is not None and v >= 0:
                          valuation_parts.append(clamp(75 - (v-base)*scale))
                  if x.get('fcf_yield') is not None:
                      valuation_parts.append(clamp(50 + x['fcf_yield']*8))
                  value = avg(valuation_parts)

                  cash_parts = []
                  if x.get('fcf') is not None: cash_parts.append(80)
                  if x.get('ocf') is not None: cash_parts.append(80)
                  if x.get('fcf_yield') is not None: cash_parts.append(clamp(50 + x['fcf_yield']*8))
                  if x.get('net_debt_ebitda') is not None:
                      cash_parts.append(clamp(80 - x['net_debt_ebitda']*15))
                  cash = avg(cash_parts, 55)

                  revision_base = 50
                  up = x.get('eps_up_30d') or 0
                  down = x.get('eps_down_30d') or 0
                  revision_base += min(30, up*7) - min(30, down*7)
                  revision_base += min(15, (x.get('upgrades_90d') or 0)*5)
                  revision_base -= min(15, (x.get('downgrades_90d') or 0)*5)
                  if x.get('eps_trend_30d') is not None:
                      revision_base += clamp(x['eps_trend_30d']*2, -20, 20)
                  revisions = clamp(revision_base)

                  rec = x.get('recommendation')
                  analyst = 80 if rec in ('strong_buy','buy') else 55 if rec == 'hold' else 25 if rec in ('sell','strong_sell') else 50
                  if x.get('target_mean') and price:
                      analyst = clamp(analyst*0.6 + clamp(50 + ((x['target_mean']/price)-1)*100)*0.4)

                  momentum = clamp(100*price/x['high_52w']) if price and x.get('high_52w') else 50
                  dividend_yield = x.get('dividend_yield') or 0
                  dividend = clamp(15 + dividend_yield*17)
                  payout = x.get('payout_ratio')
                  if payout is not None:
                      if payout > 100: dividend -= 25
                      elif payout > 80: dividend -= 10
                  dividend = clamp(dividend)

                  # Round the displayed component scores FIRST, then calculate the headline scores
                  # from those exact displayed integers. This makes every score mathematically auditable.
                  growth_score = round(g)
                  quality_score = round(q)
                  value_score = round(value)
                  cashflow_score = round(cash)
                  revisions_score = round(revisions)
                  momentum_score = round(momentum)
                  dividend_score = round(dividend)
                  analyst_score = round(analyst)

                  # Deep score: the headline is calculated from the exact driver values shown in the UI.
                  deep_components = [
                      growth_score * .25, quality_score * .20, value_score * .15,
                      cashflow_score * .15, revisions_score * .10, momentum_score * .05,
                      dividend_score * .10
                  ]
                  deep = round(sum(deep_components))

                  # High-level score: same rule — calculate from the exact displayed component values.
                  high = round(growth_score * .35 + quality_score * .25 + momentum_score * .15 + analyst_score * .25)

                  verdict = 'BUY' if deep >= 82 and high >= 75 else 'WATCH' if deep >= 72 and high >= 65 else 'HOLD' if deep >= 60 else 'AVOID'
                  if verdict == 'BUY' and value < 45: verdict = 'WATCH'
                  if q < 35 and cash < 35: verdict = 'AVOID'
                  if str(x.get('asset_type','')).upper() in ('ETF','MUTUALFUND'): verdict = 'ETF'

                  x.update({
                    'growth_score': growth_score, 'quality_score': quality_score, 'value_score': value_score,
                    'cashflow_score': cashflow_score, 'revisions_score': revisions_score,
                    'momentum_score': momentum_score, 'dividend_score': dividend_score,
                    'analyst_score': analyst_score, 'high_score': high, 'deep_score': deep,
                    'deep_score_components': deep_components,
                    'verdict': verdict
                  })

                  oldx = previous.get(symbol, {})
                  if oldx.get('deep_score') is not None:
                      x['deep_score_change'] = deep - oldx['deep_score']
                  if oldx.get('high_score') is not None:
                      x['high_score_change'] = high - oldx['high_score']
                  if oldx.get('verdict'):
                      x['previous_verdict'] = oldx['verdict']

                  # Explain Deep Score movement using the weighted driver changes.
                  if oldx.get('deep_score') is not None:
                      driver_specs = [
                          ('Growth', 'growth_score', .25), ('Quality', 'quality_score', .20),
                          ('Value', 'value_score', .15), ('Cash Flow', 'cashflow_score', .15),
                          ('Revisions', 'revisions_score', .10), ('Momentum', 'momentum_score', .05),
                          ('Dividend', 'dividend_score', .10)
                      ]
                      changes = []
                      for label, key, weight in driver_specs:
                          oldv = oldx.get(key); newv = x.get(key)
                          if oldv is not None and newv is not None:
                              delta = newv - oldv
                              impact = delta * weight
                              if delta != 0:
                                  changes.append({'factor': label, 'delta': delta, 'impact': round(impact, 2)})
                      changes.sort(key=lambda z: abs(z['impact']), reverse=True)
                      x['deep_score_change_reasons'] = changes[:3]

                  # Make extreme trailing P/E useful rather than hiding it.
                  pe = x.get('pe'); fpe = x.get('forward_pe')
                  if pe is not None and pe >= 100:
                      if fpe is not None and fpe < pe * 0.5:
                          x['valuation_warning'] = 'Very high trailing P/E; forward earnings are materially stronger.'
                      else:
                          x['valuation_warning'] = 'Very high trailing P/E; inspect earnings quality and forward estimates.'

              except Exception as e:
                  x['error'] = str(e)[:200]

              out['stocks'].append(x)
              time.sleep(.15)

          # Save one historical snapshot per Melbourne calendar day.
          # The daily job is triggered at 20:30 UTC (~07:30 Melbourne during daylight saving).
          if is_daily_snapshot_run and snapshot_date:
              snapshot_path = os.path.join(snapshot_dir, snapshot_date + '.json')
              snapshot_payload = dict(out)
              snapshot_payload['snapshot_date'] = snapshot_date
              snapshot_payload['snapshot_timezone'] = 'Australia/Melbourne'
              snapshot_payload['snapshot_type'] = 'daily'
              with open(snapshot_path, 'w', encoding='utf-8') as sfh:
                  json.dump(snapshot_payload, sfh, separators=(',', ':'), ensure_ascii=False)
              out['last_daily_snapshot'] = snapshot_date
          elif prior_files:
              out['last_daily_snapshot'] = prior_files[-1][:10]

          with open('market-data.json', 'w', encoding='utf-8') as fh:
              json.dump(out, fh, separators=(',', ':'), ensure_ascii=False)
          PY

      - name: Commit data
        run: |
          git config user.name "malone-markets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json snapshots/
          git diff --cached --quiet || git commit -m "Update Malone Markets data and daily snapshot"
          git push
