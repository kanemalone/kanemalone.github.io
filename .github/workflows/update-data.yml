name: Update Malone Markets data

# Prevent overlapping scheduled/manual runs from racing on main.
concurrency:
  group: malone-markets-data
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build ASX + US universe
        run: |
          python -m pip install --disable-pip-version-check -q pandas lxml requests
          python <<'PY'
          import json, re, requests, pandas as pd
          from io import StringIO
          HEADERS={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}
          def uniq(seq): return list(dict.fromkeys([str(x).strip().upper() for x in seq if str(x).strip()]))
          def clean_asx(vals):
              out=[]
              for v in vals:
                  m=re.search(r'\b([A-Z0-9]{1,5})\b',str(v).upper())
                  if m and m.group(1) not in ('NAN','CODE','COMPANY','SYMBOL'): out.append(m.group(1)+'.AX')
              return uniq(out)
          def asx_tables(url):
              r=requests.get(url,headers=HEADERS,timeout=60); r.raise_for_status()
              for tbl in pd.read_html(StringIO(r.text)):
                  cols=[str(c).strip().lower() for c in tbl.columns]
                  for i,c in enumerate(cols):
                      if c in ('code','asx code','ticker','symbol'):
                          cand=clean_asx(tbl.iloc[:,i].tolist())
                          if len(cand)>=400: return cand
                  for col in tbl.columns:
                      cand=uniq([m+'.AX' for v in tbl[col].astype(str).tolist() for m in re.findall(r'\(([A-Z0-9]{1,5})\)',v.upper())])
                      if len(cand)>=400: return cand
              return []
          asx=[]
          for url in ['https://www.marketindex.com.au/all-ordinaries/','https://www.marketindex.com.au/asx-listed-companies','https://www.fundlater.com.au/indices/xao/all-ordinaries']:
              try:
                  asx=asx_tables(url); print(f'ASX source {url}: {len(asx)} tickers')
                  if len(asx)>=450: break
              except Exception as e: print(f'ASX source failed {url}: {e}')
          asx_directory=[]
          if len(asx)<450:
              try:
                  r=requests.get('https://www.asx.com.au/asx/research/ASXListedCompanies.csv',headers=HEADERS,timeout=60); r.raise_for_status()
                  for line in r.text.splitlines()[1:]:
                      parts=[p.strip().strip('\"') for p in line.split(',')]
                      if len(parts)>=2 and re.fullmatch(r'[A-Z0-9]{1,5}',parts[1].upper()): asx.append(parts[1].upper()+'.AX')
                  asx_directory=uniq(asx); asx=uniq(asx); print(f'ASX directory fallback: {len(asx)} tickers')
              except Exception as e: print(f'ASX directory fallback failed: {e}')
          us=[]
          for url in ['https://raw.githubusercontent.com/chinobing/historical_sp500_constituents/main/sp500_constituents.csv','https://en.wikipedia.org/wiki/List_of_S%26P_500_companies']:
              try:
                  if url.endswith('.csv'):
                      df=pd.read_csv(url); col=next((c for c in df.columns if str(c).lower() in ('symbol','ticker symbol','ticker')),None)
                      if col: us=[str(x).strip().replace('.','-') for x in df[col].tolist() if str(x).strip() and str(x).lower()!='nan']
                  else:
                      for tbl in pd.read_html(url):
                          for col in ('Symbol','Ticker symbol','Ticker'):
                              if col in tbl.columns: us=[str(x).strip().replace('.','-') for x in tbl[col].tolist() if str(x).strip() and str(x).lower()!='nan']; break
                          if len(us)>=450: break
                  us=uniq(us); print(f'US source {url}: {len(us)} tickers')
                  if len(us)>=450: break
              except Exception as e: print(f'US source failed {url}: {e}')
          # Keep a directory list available to fill the last few ASX slots if the index has 495
          # active constituents rather than a literal 500 on the day of the run.
          if len(asx)<500 and not asx_directory:
              try:
                  r=requests.get('https://www.asx.com.au/asx/research/ASXListedCompanies.csv',headers=HEADERS,timeout=60); r.raise_for_status()
                  for line in r.text.splitlines()[1:]:
                      parts=[p.strip().strip('\"') for p in line.split(',')]
                      if len(parts)>=2 and re.fullmatch(r'[A-Z0-9]{1,5}',parts[1].upper()): asx_directory.append(parts[1].upper()+'.AX')
                  asx_directory=uniq(asx_directory)
                  print(f'ASX directory filler: {len(asx_directory)} tickers')
              except Exception as e: print(f'ASX directory filler failed: {e}')
          with open('watchlist.json','r',encoding='utf-8') as fh: existing=[x for x in json.load(fh) if x.get('symbol')]
          preferred_asx=uniq([x['symbol'] for x in existing if str(x['symbol']).upper().endswith('.AX')])
          preferred_us=uniq([x['symbol'] for x in existing if not str(x['symbol']).upper().endswith('.AX')])
          def target(base,preferred,n,filler=[]): return uniq(uniq(preferred)+uniq(base)+uniq(filler))[:n]
          asx=target(asx,preferred_asx,500,asx_directory); us=target(us,preferred_us,500)
          if len(asx)<450 or len(us)<450: raise SystemExit(f'Universe build failed validation: ASX={len(asx)}, US={len(us)}. Refusing to fall back to the 100-stock watchlist.')
          universe={'version':'ASX 500 + US 500','asx':asx,'us':us,'symbols':asx+us}
          with open('universe.json','w',encoding='utf-8') as fh: json.dump(universe,fh)
          print(f'FINAL UNIVERSE: {len(universe["symbols"])} | ASX={len(asx)} | US={len(us)}')
          PY

      - name: Upload universe
        uses: actions/upload-artifact@v4
        with:
          name: universe-list
          path: universe.json

  fetch:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download prepared universe
        uses: actions/download-artifact@v4
        with:
          name: universe-list
          path: .

      - name: Fetch Yahoo Finance data
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          python -m pip install --disable-pip-version-check -q yfinance pandas lxml
          python <<'PY'
          import yfinance as yf
          import pandas as pd
          import json, math, time, os
          from datetime import datetime, timezone
          
          import requests, re
          
          with open('universe.json', 'r', encoding='utf-8') as fh:
              universe = json.load(fh)
          symbols = universe.get('symbols', [])
          print(f"Prepared universe: {len(symbols)} symbols | ASX {len(universe.get('asx', []))} | US {len(universe.get('us', []))}")
          shard = int(os.environ.get('SHARD', '0'))
          shards = int(os.environ.get('SHARDS', '4'))
          symbols = [sym for i, sym in enumerate(symbols) if i % shards == shard]
          print(f'Shard {shard+1}/{shards}: {len(symbols)} symbols')
          
          now = datetime.now(timezone.utc)
          is_daily_snapshot_run = os.environ.get("DAILY_SNAPSHOT", "false").lower() == "true"
          out = {
            'updated_at': now.isoformat(),
            'source': 'Yahoo Finance via yfinance',
            'model_version': '6.0.0',
            'stocks': []
          }
          
          # Daily snapshot baseline: compare against the most recent saved daily snapshot,
          # not the previous 15-minute refresh. This keeps score movement meaningful.
          previous = {}
          snapshot_date = None
          try:
              from zoneinfo import ZoneInfo
              mel_now = now.astimezone(ZoneInfo('Australia/Melbourne'))
              snapshot_date = mel_now.date().isoformat()
          except Exception:
              snapshot_date = now.date().isoformat()
          
          snapshot_dir = 'snapshots'
          os.makedirs(snapshot_dir, exist_ok=True)
          prior_files = sorted([f for f in os.listdir(snapshot_dir) if f.endswith('.json') and f[:10] < snapshot_date])
          if prior_files:
              try:
                  with open(os.path.join(snapshot_dir, prior_files[-1]), 'r', encoding='utf-8') as fh:
                      old = json.load(fh)
                  previous = {x.get('symbol'): x for x in old.get('stocks', [])}
              except Exception:
                  previous = {}
          
          def n(v):
              try:
                  if v is None: return None
                  v = float(v)
                  return None if math.isnan(v) or math.isinf(v) else v
              except Exception:
                  return None
          
          def pct(v):
              v = n(v)
              if v is None: return None
              return v * 100 if abs(v) <= 2 else v
          
          def avg(values, default=50):
              vals = [v for v in values if v is not None]
              return sum(vals)/len(vals) if vals else default
          
          def clamp(v, lo=0, hi=100):
              return max(lo, min(hi, v))
          
          def first_num(*vals):
              for v in vals:
                  v = n(v)
                  if v is not None:
                      return v
              return None
          
          def frame_row(df, key):
              try:
                  if df is None or len(df) == 0: return {}
                  if key in df.index:
                      row = df.loc[key]
                      return row.to_dict() if hasattr(row, 'to_dict') else {}
              except Exception:
                  pass
              return {}
          
          def cell(df, key, column=None):
              try:
                  row = frame_row(df, key)
                  if column is None:
                      vals = list(row.values())
                      return n(vals[0]) if vals else None
                  return n(row.get(column))
              except Exception:
                  return None
          
          def safe_call(fn, default=None):
              try:
                  return fn()
              except Exception:
                  return default
          
          def epoch_to_iso(value):
              # Yahoo commonly supplies providerPublishTime as Unix seconds.
              # Guard against milliseconds and invalid/1970-style values.
              try:
                  if isinstance(value, str):
                      s = value.strip()
                      if not s: return None
                      if s.isdigit(): value = float(s)
                      else:
                          dt = datetime.fromisoformat(s.replace('Z', '+00:00'))
                          return dt.astimezone(timezone.utc).isoformat()
                  value = float(value)
                  if value > 10_000_000_000: value /= 1000.0
                  if value < 946684800 or value > (now.timestamp() + 366*24*3600): return None
                  return datetime.fromtimestamp(value, timezone.utc).isoformat()
              except Exception:
                  return None
          
          audusd = n(safe_call(lambda: yf.Ticker('AUDUSD=X').fast_info.get('last_price'), None)) or 0.66
          
          def normalize_news(items):
              result = []
              seen = set()
              for item in items or []:
                  if not isinstance(item, dict): continue
                  content = item.get('content') if isinstance(item.get('content'), dict) else item
                  title = content.get('title') or item.get('title')
                  link = content.get('canonicalUrl', {}).get('url') if isinstance(content.get('canonicalUrl'), dict) else None
                  if not link and isinstance(content.get('clickThroughUrl'), dict): link = content.get('clickThroughUrl', {}).get('url')
                  link = link or content.get('link') or item.get('link') or item.get('url')
                  publisher = content.get('provider', {}).get('displayName') if isinstance(content.get('provider'), dict) else None
                  publisher = publisher or content.get('publisher') or item.get('publisher')
                  ts = content.get('providerPublishTime') or item.get('providerPublishTime') or content.get('pubDate') or item.get('pubDate')
                  published = epoch_to_iso(ts)
                  if not title or not link: continue
                  key = (title.strip(), link)
                  if key in seen: continue
                  seen.add(key)
                  result.append({'title': title.strip(), 'publisher': publisher or 'Yahoo Finance', 'link': link, 'published_at': published})
              result.sort(key=lambda x: x.get('published_at') or '', reverse=True)
              return result[:5]
          
          for symbol in symbols:
              x = {'symbol': symbol}
              try:
                  t = yf.Ticker(symbol)
                  info = safe_call(lambda: t.get_info() or {}, {})
                  fast = safe_call(lambda: t.fast_info or {}, {})
          
                  price = n(info.get('currentPrice')) or n(fast.get('last_price'))
                  prev = n(info.get('previousClose')) or n(fast.get('previous_close'))
                  market_cap = n(info.get('marketCap'))
                  currency = info.get('currency') or info.get('financialCurrency')
                  market_cap_usd = market_cap / audusd if market_cap is not None and str(currency).upper() == 'AUD' and audusd else market_cap
                  fcf = n(info.get('freeCashflow'))
                  ocf = n(info.get('operatingCashflow'))
                  total_debt = n(info.get('totalDebt'))
                  cash = n(info.get('totalCash'))
                  ebitda = n(info.get('ebitda'))
                  shares_out = first_num(info.get('sharesOutstanding'), info.get('impliedSharesOutstanding'))
          
                  # Pull investment intensity only when it can materially explain weak FCF.
                  rd_expense = None
                  capex = None
                  if fcf is not None and fcf < 0:
                      inc = safe_call(lambda: t.income_stmt, None)
                      cf = safe_call(lambda: t.cashflow, None)
                      for key in ('Research And Development', 'ResearchDevelopment'):
                          rd_expense = first_num(rd_expense, cell(inc, key))
                      for key in ('Capital Expenditure', 'CapitalExpenditure'):
                          capex = first_num(capex, cell(cf, key))
          
                  x.update({
                    'price': price,
                    'previous_close': prev,
                    'day_pct': ((price/prev)-1)*100 if price and prev else None,
                    'market_cap': market_cap,
                    'market_cap_usd': market_cap_usd,
                    'pe': n(info.get('trailingPE')),
                    'forward_pe': n(info.get('forwardPE')),
                    'peg': n(info.get('pegRatio')),
                    'ps': n(info.get('priceToSalesTrailing12Months')),
                    'pb': n(info.get('priceToBook')),
                    'ev_ebitda': n(info.get('enterpriseToEbitda')),
                    'revenue_growth': pct(info.get('revenueGrowth')),
                    'earnings_growth': pct(info.get('earningsGrowth')),
                    'profit_margin': pct(info.get('profitMargins')),
                    'operating_margin': pct(info.get('operatingMargins')),
                    'roe': pct(info.get('returnOnEquity')),
                    'roa': pct(info.get('returnOnAssets')),
                    'roic': pct(info.get('returnOnCapital')),
                    'fcf': fcf,
                    'ocf': ocf,
                    'shares_outstanding': shares_out,
                    'rd_expense': abs(rd_expense) if rd_expense is not None else None,
                    'capex': abs(capex) if capex is not None else None,
                    'fcf_yield': (fcf/market_cap)*100 if fcf is not None and market_cap else None,
                    'p_fcf': (market_cap/fcf) if fcf is not None and market_cap and fcf > 0 else None,
                    'net_debt_ebitda': ((total_debt or 0) - (cash or 0))/ebitda if ebitda and total_debt is not None else None,
                    'dividend_rate': n(info.get('dividendRate')),
                    'dividend_yield': None,
                    'dividend_yield_raw': n(info.get('dividendYield')),
                    'payout_ratio': pct(info.get('payoutRatio')),
                    'target_mean': n(info.get('targetMeanPrice')),
                    'target_low': n(info.get('targetLowPrice')),
                    'target_high': n(info.get('targetHighPrice')),
                    'recommendation': info.get('recommendationKey'),
                    'high_52w': n(info.get('fiftyTwoWeekHigh')),
                    'low_52w': n(info.get('fiftyTwoWeekLow')),
                    'sector': info.get('sector'),
                    'industry': info.get('industry'),
                    'currency': currency,
                    'asset_type': info.get('quoteType') or info.get('typeDisp')
                  })
          
                  # Normalize dividend yield from annual cash dividend / price when available.
                  if x.get('dividend_rate') is not None and price:
                      calc_yield = (x['dividend_rate'] / price) * 100
                      if 0 <= calc_yield <= 20: x['dividend_yield'] = calc_yield
                  if x.get('dividend_yield') is None and x.get('dividend_yield_raw') is not None:
                      raw = x['dividend_yield_raw']; candidate = raw * 100 if abs(raw) <= 2 else raw
                      if 0 <= candidate <= 20: x['dividend_yield'] = candidate
          
                  # Analyst forward estimates and EPS trend/revisions.
                  ee = safe_call(lambda: t.get_earnings_estimate(), None)
                  re = safe_call(lambda: t.get_revenue_estimate(), None)
                  et = safe_call(lambda: t.get_eps_trend(), None)
                  er = safe_call(lambda: t.get_eps_revisions(), None)
                  ge = safe_call(lambda: t.get_growth_estimates(), None)
                  eh = safe_call(lambda: t.get_earnings_history(), None)
          
                  def df_value(df, idx, col):
                      try:
                          if df is None or idx not in df.index or col not in df.columns: return None
                          return n(df.loc[idx, col])
                      except Exception: return None
          
                  x['forward_eps_growth'] = pct(df_value(ee, '+1y', 'growth'))
                  x['forward_revenue_growth'] = pct(df_value(re, '+1y', 'growth'))
                  x['eps_estimate'] = df_value(ee, '+1y', 'avg')
                  x['revenue_estimate'] = df_value(re, '+1y', 'avg')
                  x['eps_trend_30d'] = None
                  cur_eps = df_value(et, '+1y', 'current')
                  old_eps = df_value(et, '+1y', '30daysAgo')
                  if cur_eps is not None and old_eps not in (None, 0):
                      x['eps_trend_30d'] = (cur_eps/old_eps - 1)*100
                  x['eps_up_7d'] = df_value(er, '+1y', 'upLast7days')
                  x['eps_up_30d'] = df_value(er, '+1y', 'upLast30days')
                  x['eps_down_7d'] = df_value(er, '+1y', 'downLast7days')
                  x['eps_down_30d'] = df_value(er, '+1y', 'downLast30days')
                  x['long_term_growth'] = pct(df_value(ge, '+5y', 'stock'))
          
                  # Latest earnings surprise.
                  x['latest_surprise_pct'] = None
                  try:
                      if eh is not None and len(eh):
                          latest = eh.sort_index().iloc[-1]
                          x['latest_surprise_pct'] = n(latest.get('surprisePercent'))
                  except Exception:
                      pass
          
                  # Recent analyst changes.
                  x['upgrades_90d'] = 0
                  x['downgrades_90d'] = 0
                  ud = safe_call(lambda: t.get_upgrades_downgrades(), None)
                  try:
                      if ud is not None and len(ud):
                          cutoff = pd.Timestamp.now(tz='UTC') - pd.Timedelta(days=90)
                          idx = pd.to_datetime(ud.index, utc=True, errors='coerce')
                          recent = ud[idx >= cutoff]
                          actions = recent['action'].astype(str).str.lower() if 'action' in recent.columns else pd.Series(dtype=str)
                          to_grades = recent['toGrade'].astype(str).str.lower() if 'toGrade' in recent.columns else pd.Series(dtype=str)
                          from_grades = recent['fromGrade'].astype(str).str.lower() if 'fromGrade' in recent.columns else pd.Series(dtype=str)
                          up_mask = actions.str.contains(r'upgrade|raised|raise|overweight|outperform|buy', regex=True, na=False)
                          down_mask = actions.str.contains(r'downgrade|lowered|lower|underweight|underperform|sell', regex=True, na=False)
                          if not up_mask.any() and len(recent):
                              up_mask = to_grades.str.contains(r'buy|outperform|overweight|strong buy', regex=True, na=False) & ~from_grades.str.contains(r'buy|outperform|overweight|strong buy', regex=True, na=False)
                          if not down_mask.any() and len(recent):
                              down_mask = to_grades.str.contains(r'sell|underperform|underweight|reduce', regex=True, na=False) & ~from_grades.str.contains(r'sell|underperform|underweight|reduce', regex=True, na=False)
                          x['upgrades_90d'] = int(up_mask.sum())
                          x['downgrades_90d'] = int(down_mask.sum())
                  except Exception:
                      pass
          
                  # News with robust timestamp normalization.
                  news = safe_call(lambda: t.get_news(count=8), [])
                  normalized_news = normalize_news(news)
                  if not normalized_news:
                      search = safe_call(lambda: yf.Search(symbol, news_count=8), None)
                      search_news = getattr(search, 'news', []) if search is not None else []
                      normalized_news = normalize_news(search_news)
                  x['news'] = normalized_news
          
                  # ---------- Malone Score V6.0 ----------
                  # One 0-100 score built from seven independent factors. The previous
                  # Deep/High/Story/Opportunity stack is no longer used for decisions.
                  import math as _math

                  def score_linear(v, center=0, scale=1.0):
                      if v is None: return None
                      return clamp(50 + (v - center) * scale)

                  def score_multiple(v, fair=20, sensitivity=2.0):
                      if v is None or v <= 0: return None
                      return clamp(75 - (v - fair) * sensitivity)

                  def mean_scores(parts, default=50):
                      vals=[v*w for v,w in parts if v is not None]
                      weights=[w for v,w in parts if v is not None]
                      return sum(vals)/sum(weights) if weights else default

                  # 1. Growth (20%)
                  growth_score=round(mean_scores([
                      (score_linear(x.get('revenue_growth'),0,1.6),.20),
                      (score_linear(x.get('earnings_growth'),0,1.4),.20),
                      (score_linear(x.get('forward_eps_growth'),0,1.8),.30),
                      (score_linear(x.get('forward_revenue_growth'),0,1.5),.15),
                      (score_linear(x.get('long_term_growth'),0,1.2),.15),
                  ]))

                  # 2. Quality (20%)
                  quality_score=round(mean_scores([
                      (score_linear(x.get('profit_margin'),0,1.4),.20),
                      (score_linear(x.get('operating_margin'),0,1.3),.20),
                      (score_linear(x.get('roe'),10,1.0),.20),
                      (score_linear(x.get('roic'),10,1.15),.25),
                      (score_linear(x.get('roa'),5,2.0),.15),
                  ]))

                  # 3. Financial strength / cash generation (15%). Existence of FCF/OCF
                  # is no longer worth an automatic 80. The score reflects cash yield,
                  # leverage and cash-flow quality. Banks/real estate are treated differently
                  # because conventional net-debt/EBITDA is not comparable for them.
                  financial_parts=[]
                  if x.get('fcf_yield') is not None:
                      financial_parts.append((clamp(50+x['fcf_yield']*5),.30))
                  sector_name=str(x.get('sector') or '').lower()
                  if x.get('net_debt_ebitda') is not None and sector_name not in ('financial services','real estate'):
                      financial_parts.append((clamp(78-x['net_debt_ebitda']*12),.30))
                  if x.get('fcf') is not None and x.get('ocf') is not None:
                      financial_parts.append((75 if x['fcf']>0 and x['ocf']>0 else 58 if x['ocf']>0 else 35,.20))
                  if x.get('payout_ratio') is not None:
                      financial_parts.append((clamp(85-max(0,x['payout_ratio']-50)*1.0),.10))
                  if sector_name in ('financial services','real estate'):
                      financial_parts.append((score_linear(x.get('roe'),10,1.0),.25))
                  financial_score=round(mean_scores(financial_parts,50))

                  # 4. Valuation (20%). Fair value is included, but analyst targets are
                  # not separately counted here because they already feed the Fair Value engine.
                  valuation_parts=[]
                  if x.get('forward_pe') is not None: valuation_parts.append((score_multiple(x['forward_pe'],18,2.0),.22))
                  if x.get('pe') is not None: valuation_parts.append((score_multiple(x['pe'],20,1.7),.13))
                  if x.get('peg') is not None and x['peg']>0: valuation_parts.append((clamp(75-(x['peg']-1)*25),.12))
                  if x.get('ev_ebitda') is not None: valuation_parts.append((score_multiple(x['ev_ebitda'],15,1.8),.15))
                  if x.get('pb') is not None: valuation_parts.append((score_multiple(x['pb'],3,8),.10))
                  if x.get('fcf_yield') is not None: valuation_parts.append((clamp(50+x['fcf_yield']*6),.13))
                  if upside_pct is not None:
                      fv_score=clamp(50+45*_math.tanh(upside_pct/60.0))
                      valuation_parts.append((fv_score,.15))
                  else:
                      fv_score=50
                  valuation_score=round(mean_scores(valuation_parts,50))

                  # 5. Momentum (10%). A true 52-week range position is preferable to
                  # simply price / 52-week high: stocks near their lows score poorly.
                  momentum_score=50
                  if price and x.get('high_52w') and x.get('low_52w') and x['high_52w']>x['low_52w']:
                      range_position=(price-x['low_52w'])/(x['high_52w']-x['low_52w'])
                      momentum_score=round(clamp(10+range_position*80))

                  # 6. Earnings revisions (10%)
                  revision_score=50
                  up=x.get('eps_up_30d') or 0; down=x.get('eps_down_30d') or 0
                  revision_score += min(25,up*6)-min(25,down*6)
                  revision_score += min(12,(x.get('upgrades_90d') or 0)*4)
                  revision_score -= min(12,(x.get('downgrades_90d') or 0)*4)
                  if x.get('eps_trend_30d') is not None: revision_score += clamp(x['eps_trend_30d']*1.5,-15,15)
                  if x.get('latest_surprise_pct') is not None: revision_score += clamp(x['latest_surprise_pct']*.8,-12,12)
                  revisions_score=round(clamp(revision_score))

                  # 7. Dividend / shareholder return (5%)
                  dividend_score=clamp(20+(x.get('dividend_yield') or 0)*12)
                  payout=x.get('payout_ratio')
                  if payout is not None:
                      if payout>100: dividend_score-=25
                      elif payout>80: dividend_score-=10
                  dividend_score=round(clamp(dividend_score))

                  # Fair value was calculated above and is deliberately not a separate headline.
                  # Round the seven visible component scores first, then calculate the headline.
                  malone_components=[
                      growth_score*.20, quality_score*.20, financial_score*.15,
                      valuation_score*.20, momentum_score*.10, revisions_score*.10,
                      dividend_score*.05
                  ]
                  malone_score=round(sum(malone_components))

                  # Investor-facing decision: only BUY / HOLD / SELL.
                  severe_risk=(quality_score<30 and financial_score<35)
                  sell_signal=(malone_score<45) or severe_risk
                  buy_signal=(malone_score>=70 and quality_score>=45 and financial_score>=40 and valuation_score>=45)
                  verdict='BUY' if buy_signal else 'SELL' if sell_signal else 'HOLD'
                  if str(x.get('asset_type','')).upper() in ('ETF','MUTUALFUND'): verdict='HOLD'

                  # Compatibility fields for older frontend components. They are aliases and
                  # no longer drive the investment decision.
                  deep=malone_score; high=malone_score; opportunity_score=malone_score
                  story=round(mean_scores([(growth_score,.35),(quality_score,.25),(revisions_score,.20),(valuation_score,.20)]))
                  value_score=valuation_score; cashflow_score=financial_score
                  analyst_score=round(clamp(50+((x.get('target_mean')/price)-1)*100)) if x.get('target_mean') and price else 50
                  opportunity_verdict=verdict

                  x.update({
                    'growth_score':growth_score,'quality_score':quality_score,'value_score':value_score,
                    'cashflow_score':cashflow_score,'financial_score':financial_score,
                    'revisions_score':revisions_score,'momentum_score':momentum_score,'dividend_score':dividend_score,
                    'analyst_score':analyst_score,'malone_score':malone_score,
                    'malone_score_components':malone_components,'high_score':high,'deep_score':deep,
                    'deep_score_components':malone_components,'story_score':story,'opportunity_score':opportunity_score,
                    'malone_fair_value':malone_fair_value,'fair_value_low':fair_low,'fair_value_high':fair_high,
                    'expected_12m_value':expected_12m,'upside_pct':upside_pct,'upside_score':fv_score,
                    'fair_value_confidence':fair_confidence,'fair_value_method':fair_method,
                    'earnings_fair_value':earnings_fv,'fcf_fair_value':fcf_fv,
                    'analyst_target_upside':target_upside,'investment_context':investment_reason,
                    'opportunity_verdict':opportunity_verdict,'verdict':verdict,
                    'verdict_method':'Malone Score V6.0 — BUY / HOLD / SELL'
                  })

                  oldx = previous.get(symbol, {})
                  if oldx.get('malone_score') is not None:
                      x['malone_score_change'] = malone_score - oldx['malone_score']
                  if oldx.get('deep_score') is not None:
                      x['deep_score_change'] = deep - oldx['deep_score']
                  if oldx.get('high_score') is not None:
                      x['high_score_change'] = high - oldx['high_score']
                  if oldx.get('verdict'):
                      x['previous_verdict'] = oldx['verdict']
          
                  # Explain Malone Score movement using the seven factor weights.
                  if oldx.get('malone_score') is not None:
                      driver_specs = [
                          ('Growth', 'growth_score', .20), ('Quality', 'quality_score', .20),
                          ('Financial Strength', 'financial_score', .15), ('Valuation', 'value_score', .20),
                          ('Momentum', 'momentum_score', .10), ('Revisions', 'revisions_score', .10),
                          ('Dividend', 'dividend_score', .05)
                      ]
                      changes = []
                      for label, key, weight in driver_specs:
                          oldv = oldx.get(key); newv = x.get(key)
                          if oldv is not None and newv is not None:
                              delta = newv - oldv
                              impact = delta * weight
                              if delta != 0:
                                  changes.append({'factor': label, 'delta': delta, 'impact': round(impact, 2)})
                      changes.sort(key=lambda z: abs(z['impact']), reverse=True)
                      x['malone_score_change_reasons'] = changes[:3]
          
                  # Make extreme trailing P/E useful rather than hiding it.
                  pe = x.get('pe'); fpe = x.get('forward_pe')
                  if pe is not None and pe >= 100:
                      if fpe is not None and fpe < pe * 0.5:
                          x['valuation_warning'] = 'Very high trailing P/E; forward earnings are materially stronger.'
                      else:
                          x['valuation_warning'] = 'Very high trailing P/E; inspect earnings quality and forward estimates.'
          
              except Exception as e:
                  x['error'] = str(e)[:200]
          
              out['stocks'].append(x)
              time.sleep(.15)
          
          # Shard output; merge job handles snapshots and monthly history.
          shard_payload = {
              'updated_at': out['updated_at'], 'source': out['source'],
              'model_version': out['model_version'], 'stocks': out['stocks'], 'shard': shard
          }
          with open(f"shard-{shard}.json", 'w', encoding='utf-8') as fh:
              json.dump(shard_payload, fh, separators=(',', ':'), ensure_ascii=False)
          print(f"Wrote shard-{shard}.json with {len(out['stocks'])} stocks")
          PY

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: malone-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: malone-shard-*
          path: shards
          merge-multiple: false

      - name: Merge market data and snapshots
        env:
          DAILY_SNAPSHOT: ${{ github.event.schedule == '30 20 * * *' }}
        run: |
          python -m pip install --disable-pip-version-check -q yfinance
          python <<'PY'
          import json, os, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import yfinance as yf
          
          files=[]
          for root, dirs, names in os.walk('shards'):
              for name in names:
                  if name.startswith('shard-') and name.endswith('.json'):
                      files.append(os.path.join(root,name))
          files=sorted(files)
          if not files:
              raise SystemExit('No shard files found')
          
          stocks=[]
          meta=None
          for path in files:
              with open(path,'r',encoding='utf-8') as fh:
                  p=json.load(fh)
              meta=meta or p
              stocks.extend(p.get('stocks',[]))
          
          # De-duplicate defensively by symbol.
          by_symbol={}
          for st in stocks:
              if st.get('symbol'):
                  by_symbol[st['symbol']]=st
          stocks=list(by_symbol.values())
          stocks.sort(key=lambda x:x.get('symbol',''))
          asx_count=sum(1 for x in stocks if str(x.get('symbol','')).upper().endswith('.AX'))
          us_count=len(stocks)-asx_count
          if len(stocks)<900 or asx_count<450 or us_count<450:
              raise SystemExit(f'Merged universe validation failed: total={len(stocks)}, ASX={asx_count}, US={us_count}')
          
          now=datetime.now(timezone.utc)
          mel_now=now.astimezone(ZoneInfo('Australia/Melbourne'))
          snapshot_date=mel_now.date().isoformat()
          is_daily=os.environ.get('DAILY_SNAPSHOT','false').lower()=='true'

          # Broad market dashboard data. This is separate from the 1,000-stock universe so
          # the homepage can show the actual major indices, volatility, FX and commodities.
          market_symbols={
              'ASX 200':'^AXJO','S&P 500':'^GSPC','NASDAQ':'^IXIC','Dow Jones':'^DJI',
              'Russell 2000':'^RUT','Nikkei 225':'^N225','FTSE 100':'^FTSE','VIX':'^VIX',
              'US 10Y':'^TNX','Gold':'GC=F','WTI Crude':'CL=F','AUD/USD':'AUDUSD=X','Bitcoin':'BTC-USD'
          }
          market_overview=[]
          for label,sym in market_symbols.items():
              try:
                  h=yf.Ticker(sym).history(period='5d',auto_adjust=False)
                  closes=h['Close'].dropna() if h is not None and 'Close' in h else []
                  last=float(closes.iloc[-1]) if len(closes) else None
                  prev=float(closes.iloc[-2]) if len(closes)>1 else None
                  market_overview.append({'name':label,'symbol':sym,'value':last,'day_pct':((last/prev)-1)*100 if last and prev else None})
              except Exception:
                  market_overview.append({'name':label,'symbol':sym,'value':None,'day_pct':None})

          adv=sum(1 for x in stocks if (x.get('day_pct') or 0)>0)
          dec=sum(1 for x in stocks if (x.get('day_pct') or 0)<0)
          unchanged=max(0,len(stocks)-adv-dec)
          verdict_counts={k:sum(1 for x in stocks if x.get('verdict')==k) for k in ('BUY','HOLD','SELL')}
          by_region={
              'ASX': [x for x in stocks if str(x.get('symbol','')).upper().endswith('.AX')],
              'US': [x for x in stocks if not str(x.get('symbol','')).upper().endswith('.AX')]
          }
          breadth_by_region={}
          for region,arr in by_region.items():
              a=sum(1 for x in arr if (x.get('day_pct') or 0)>0); d=sum(1 for x in arr if (x.get('day_pct') or 0)<0)
              breadth_by_region[region]={'advancing':a,'declining':d,'unchanged':max(0,len(arr)-a-d),'breadth_pct':(a/(a+d)*100 if a+d else 50)}

          sector_map={}
          for x in stocks:
              sec=x.get('sector') or 'Other'
              sector_map.setdefault(sec,[]).append(x)
          sector_overview=[]
          for sec,arr in sector_map.items():
              vals=[x.get('day_pct') for x in arr if x.get('day_pct') is not None]
              scores=[x.get('malone_score') for x in arr if x.get('malone_score') is not None]
              sector_overview.append({'sector':sec,'count':len(arr),'avg_day_pct':sum(vals)/len(vals) if vals else None,'avg_malone_score':sum(scores)/len(scores) if scores else 50})
          sector_overview.sort(key=lambda z:z.get('avg_malone_score') or 0,reverse=True)

          # Lightweight market news cache. If RSS is unavailable, the frontend keeps its
          # search-link fallback rather than failing the data refresh.
          news=[]
          news_queries=['Australian stock market ASX','US stock market Wall Street','global markets economy','RBA interest rates Australia','Federal Reserve rates','commodities gold oil markets']
          for q in news_queries:
              try:
                  url='https://news.google.com/rss/search?'+urllib.parse.urlencode({'q':q,'hl':'en-AU','gl':'AU','ceid':'AU:en'})
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  root=ET.fromstring(urllib.request.urlopen(req,timeout=12).read())
                  for item in root.findall('./channel/item')[:6]:
                      title=(item.findtext('title') or '').strip(); link=(item.findtext('link') or '').strip(); pub=(item.findtext('pubDate') or '').strip()
                      if title and link: news.append({'title':title,'link':link,'published_at':pub,'query':q})
              except Exception:
                  pass
          seen=set(); clean_news=[]
          for item in news:
              key=item['link']
              if key in seen: continue
              seen.add(key); clean_news.append(item)
              if len(clean_news)>=30: break

          out={
              'updated_at': now.isoformat(),
              'source': 'Yahoo Finance via yfinance',
              'model_version': meta.get('model_version','6.0.0'),
              'universe_version': 'ASX 500 + US 500',
              'universe_count': len(stocks),
              'stocks': stocks,
              'market_overview': market_overview,
              'market_breadth': {'advancing':adv,'declining':dec,'unchanged':unchanged,'breadth_pct':(adv/(adv+dec)*100 if adv+dec else 50),'by_region':breadth_by_region},
              'verdict_counts': verdict_counts,
              'sector_overview': sector_overview,
              'market_news': clean_news,
              'market_timezone': 'Australia/Melbourne'
          }
          
          os.makedirs('snapshots',exist_ok=True)
          prior_files=sorted([f for f in os.listdir('snapshots') if f.endswith('.json') and f[:10] < snapshot_date])
          if is_daily:
              snapshot_payload=dict(out)
              snapshot_payload.update({'snapshot_date':snapshot_date,'snapshot_timezone':'Australia/Melbourne','snapshot_type':'daily'})
              with open(os.path.join('snapshots',snapshot_date+'.json'),'w',encoding='utf-8') as fh:
                  json.dump(snapshot_payload,fh,separators=(',',':'),ensure_ascii=False)
              out['last_daily_snapshot']=snapshot_date
              os.makedirs('monthly_snapshots',exist_ok=True)
              month_key=snapshot_date[:7]
              monthly_payload=dict(out)
              monthly_payload.update({'snapshot_date':snapshot_date,'snapshot_month':month_key,'snapshot_timezone':'Australia/Melbourne','snapshot_type':'monthly_valuation'})
              with open(os.path.join('monthly_snapshots',month_key+'.json'),'w',encoding='utf-8') as fh:
                  json.dump(monthly_payload,fh,separators=(',',':'),ensure_ascii=False)
              out['last_monthly_snapshot']=month_key
          elif prior_files:
              out['last_daily_snapshot']=prior_files[-1][:10]
          
          monthly_history={}
          monthly_dir='monthly_snapshots'
          if os.path.isdir(monthly_dir):
              for mf in sorted(f for f in os.listdir(monthly_dir) if f.endswith('.json')):
                  try:
                      with open(os.path.join(monthly_dir,mf),'r',encoding='utf-8') as fh: mp=json.load(fh)
                      month=mp.get('snapshot_month') or mf[:7]
                      for st in mp.get('stocks',[]):
                          sym=st.get('symbol')
                          if not sym: continue
                          monthly_history.setdefault(sym,[]).append({
                              'month':month,'price':st.get('price'),'fair_value':st.get('malone_fair_value'),
                              'upside_pct':st.get('upside_pct'),'malone_score':st.get('malone_score'),
                              'verdict':st.get('verdict')})
                  except Exception:
                      continue
          for sym in monthly_history:
              monthly_history[sym]=sorted(monthly_history[sym],key=lambda z:z.get('month',''))[-12:]
          out['monthly_history']=monthly_history
          
          with open('market-data.json','w',encoding='utf-8') as fh:
              json.dump(out,fh,separators=(',',':'),ensure_ascii=False)
          print(f'Merged {len(stocks)} securities from {len(files)} shards')
          PY

      - name: Commit data
        run: |
          git config user.name "malone-markets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json snapshots/
          if [ -d monthly_snapshots ]; then git add monthly_snapshots/; fi
          git diff --cached --quiet || git commit -m "Update Malone Markets 1,000-stock data and snapshots"

          # Rebase the generated data commit onto the latest remote main in
          # case another commit landed while the four shards were running.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:${{ github.ref_name }}
